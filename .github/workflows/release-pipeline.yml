name: Activity log release pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demonstrate_failed_test:
        description: Run an intentional failing test to prove releases are blocked
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build one immutable release bundle
        id: version
        run: |
          python scripts/build_release.py
          echo "version=$(cat release-version.txt)" >> "$GITHUB_OUTPUT"
          sha256sum release-bundle.zip | tee release-bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            release-bundle.zip
            release-bundle.sha256
            release-version.txt
          if-no-files-found: error
          retention-days: 30

  test-unit:
    name: Unit tests Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Verify downloaded build artifact
        run: sha256sum --check release-bundle.sha256
      - name: Unit tests and coverage gate
        run: |
          python -m pytest -v tests/test_update_readme.py tests/test_build_release.py \
            --cov=scripts.update_readme --cov=scripts.build_release \
            --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=80 --junitxml=junit-unit.xml
      - name: Publish unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.python }}
          path: |
            coverage.xml
            junit-unit.xml
          if-no-files-found: warn
          retention-days: 30

  test-integration:
    name: Integration tests ${{ matrix.test_env }}
    needs: test-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_env: [staging, prod]
    env:
      TEST_ENV: ${{ matrix.test_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Test the downloaded release bundle
        run: python -m pytest -v tests/test_integration.py --junitxml=junit-integration.xml
      - name: Demonstrate failed-test release gate
        if: ${{ inputs.demonstrate_failed_test }}
        run: python -m pytest -v tests/test_failure_demo.py --junitxml=junit-failure-demo.xml
      - name: Publish integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.test_env }}
          path: |
            junit-integration.xml
            junit-failure-demo.xml
          if-no-files-found: warn
          retention-days: 30

  deploy-dev:
    needs: [build, test-unit, test-integration]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          test "$PREFIX" = dev
          test -n "$NOTE"
          TAG="$PREFIX-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists" >&2; exit 1; fi
          trap 'gh release delete "$TAG" --yes --cleanup-tag || true' ERR
          printf '%s\n\nBUILD_TAG=%s\nVersion=%s\nCommit=%s\n' "$NOTE" "$PREFIX" "$VERSION" "$TARGET" > notes.md
          gh release create "$TAG" release-bundle.zip release-bundle.sha256 --target "$TARGET" --title "$TAG" --notes-file notes.md --prerelease

  deploy-staging:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - name: Publish staging release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          test "$PREFIX" = staging
          test -n "$NOTE"
          TAG="$PREFIX-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists" >&2; exit 1; fi
          trap 'gh release delete "$TAG" --yes --cleanup-tag || true' ERR
          printf '%s\n\nBUILD_TAG=%s\nVersion=%s\nCommit=%s\n' "$NOTE" "$PREFIX" "$VERSION" "$TARGET" > notes.md
          gh release create "$TAG" release-bundle.zip release-bundle.sha256 --target "$TARGET" --title "$TAG" --notes-file notes.md --prerelease

  ai-release-review:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Draft release review with bounded read-only tools
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/release_review_agent.py
      - name: Show draft to production reviewer
        run: cat agent-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: agent-review.md
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    needs: [build, deploy-staging, ai-release-review]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
      - uses: actions/download-artifact@v4
        with:
          name: ai-review
      - name: Verify the same tested artifact
        run: sha256sum --check release-bundle.sha256
      - name: Publish production release after environment approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          test "$PREFIX" = prod
          test -n "$NOTE"
          TAG="$PREFIX-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists" >&2; exit 1; fi
          trap 'gh release delete "$TAG" --yes --cleanup-tag || true' ERR
          printf '%s\n\nBUILD_TAG=%s\nVersion=%s\nCommit=%s\n\nAI review is attached as a draft for audit; the reviewer approved this environment deployment.\n' "$NOTE" "$PREFIX" "$VERSION" "$TARGET" > notes.md
          gh release create "$TAG" release-bundle.zip release-bundle.sha256 agent-review.md --target "$TARGET" --title "$TAG" --notes-file notes.md
